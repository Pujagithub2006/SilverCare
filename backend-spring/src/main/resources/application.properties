# Server Configuration - Enabled for Public Network Access
server.port=5002
server.address=0.0.0.0
server.servlet.context-path=/

# Application Name
spring.application.name=silvercare-backend

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:silvercare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.com.silvercare=INFO
logging.level.org.springframework.web=INFO

# Twilio Configuration
twilio.account.sid=ACac18cc74bcf1b1190b4f12209bfab258
twilio.auth.token=e827f5e89c1fe9f2144af636c2da5c35
twilio.phone.number=+15707084443
twilio.enabled=true

# JWT Configuration
jwt.secret=SilverCareSecretKey2024ForJWTTokenGenerationMustBeAtLeast512BitsLongForHS512AlgorithmSecurity
jwt.expiration=86400000

# Google AI API Key (optional, for chatbot)
google.ai.api.key=AIzaSyBSdKD5Flk7zfOgnjOuw9cWgtKIISePz5Y

# CORS Configuration
cors.allowed.origins=*
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
