# Server Configuration - Enabled for Public Network Access
server.port=${PORT:8081}
server.address=0.0.0.0
server.servlet.context-path=/

# Application Name
spring.application.name=silvercare-backend

# Database Configuration - Neon PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration - Neon PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.com.silvercare=INFO
logging.level.org.springframework.web=INFO

# Twilio Production Configuration (Live Calls & SMS Enabled)
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}
twilio.enabled=${TWILIO_ENABLED:true}

# JWT Configuration
jwt.secret=${JWT_SECRET:SilverCareSecretKey2024ForJWTTokenGenerationMustBeAtLeast512BitsLongForHS512AlgorithmSecurity}
jwt.expiration=86400000

# LLM Chatbot Configuration (Supports Gemini 2.5/3.6/2.0, Groq, OpenAI, and Free Open-LLM fallback)
google.ai.api.key=${GEMINI_API_KEY:}
groq.api.key=${GROQ_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}

# CORS Configuration
cors.allowed.origins=*
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*

