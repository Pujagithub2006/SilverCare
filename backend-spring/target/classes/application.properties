# Server Configuration
server.port=5001
server.servlet.context-path=/

# Application Name
spring.application.name=silvercare-backend

# Database Configuration (H2 for development)
# Uncomment for H2 (development):
spring.datasource.url=jdbc:h2:mem:silvercare
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Uncomment for MySQL (production):
# spring.datasource.url=jdbc:mysql://localhost:3306/silvercare
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=your_username
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Uncomment for PostgreSQL (production):
# spring.datasource.url=jdbc:postgresql://localhost:5432/silvercare
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=your_username
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.silvercare=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Twilio Configuration
twilio.account.sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth.token=YOUR_TWILIO_AUTH_TOKEN
twilio.phone.number=YOUR_TWILIO_PHONE_NUMBER
twilio.enabled=true

# JWT Configuration
jwt.secret=SilverCareSecretKey2024ForJWTTokenGenerationMustBeAtLeast512BitsLongForHS512AlgorithmSecurity
jwt.expiration=86400000

# Google AI API Key (optional, for chatbot)
google.ai.api.key=YOUR_API_KEY

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://127.0.0.1:3000
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
